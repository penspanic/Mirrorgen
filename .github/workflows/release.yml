name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  nuget:
    name: Publish NuGet packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack Mirrorgen.sln -c Release -o artifacts

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Skip notice (no NUGET_API_KEY secret)
        if: env.NUGET_API_KEY == ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: echo "::notice::NUGET_API_KEY secret not set; skipping nuget.org publish."

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  npm:
    name: Publish @mirrorgen/runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: runtime-ts/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public

      - name: Skip notice (no NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN == ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "::notice::NPM_TOKEN secret not set; skipping npmjs publish."

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [nuget, npm]
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "${{ github.ref_name }}"
