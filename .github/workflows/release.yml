name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  nuget:
    name: Publish NuGet packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag drives MinVer, and `dotnet nuget push` cannot be taken back —
      # nuget.org refuses to unlist a pushed version. A tag placed on a commit
      # that is not on main publishes whatever that commit happened to be;
      # 0.3.0-alpha.39 was exactly that and is stuck on nuget.org forever
      # (#74). Fail before Pack rather than after Push.
      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not an ancestor of origin/main. Releases are cut from main only — see CONTRIBUTING.md."
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack Mirrorgen.sln -c Release -o artifacts

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Skip notice (no NUGET_API_KEY secret)
        if: env.NUGET_API_KEY == ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: echo "::notice::NUGET_API_KEY secret not set; skipping nuget.org publish."

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          # Inter-job handoff only (downloaded by the publish job in this same
          # run). No reason to keep it for the 90-day default — shortest TTL
          # avoids piling up account-wide shared Actions storage.
          retention-days: 1

  npm:
    name: Publish @mirrorgen/runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime-ts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: runtime-ts/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public

      - name: Skip notice (no NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN == ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "::notice::NPM_TOKEN secret not set; skipping npmjs publish."

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [nuget, npm]
    steps:
      - uses: actions/checkout@v7

      - name: Download nuget-packages artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nuget-packages

      - name: Detect prerelease from tag
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release with .nupkg assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "${{ github.ref_name }}" \
            ${{ steps.tag.outputs.prerelease }} \
            nuget-packages/*.nupkg
