name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # MinVer needs full history for version computation

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mirrorgen.sln

      - name: Build
        run: dotnet build Mirrorgen.sln --no-restore -c Release

      - name: Test
        run: dotnet test Mirrorgen.sln --no-build -c Release --verbosity normal

      - name: Pack (verify packaging)
        # `--no-build` was dropped because samples/minimal's ProjectReference
        # graph causes dotnet pack to re-invoke Build on the publishable
        # projects, which then collides with NoBuild=true (NETSDK1085). The
        # pack step does its own incremental build pass instead.
        run: dotnet pack Mirrorgen.sln -c Release -o artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          # Short retention — these are smoke-test artifacts to sanity-check
          # packaging on every push. The actual release packages are
          # produced by release.yml when a tag is pushed.
          retention-days: 3

  runtime-ts:
    name: runtime-ts build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime-ts
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: runtime-ts/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
