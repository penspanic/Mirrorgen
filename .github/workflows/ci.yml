name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # MinVer needs full history for version computation

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mirrorgen.sln

      - name: Build
        run: dotnet build Mirrorgen.sln --no-restore -c Release

      - name: Verify committed _generated artifacts are current
        # The sample _generated/ dirs are force-tracked (see .gitignore) so a
        # fresh clone runs `npm test` without invoking the CLI first. The Build
        # above re-emits them via the Mirrorgen MSBuild target; if the working
        # tree now differs, a walker/sample change shipped without regenerating
        # the committed output. `git status --porcelain` catches both modified
        # tracked files and brand-new emitted files (e.g. a new Domain.ts).
        run: |
          changed="$(git status --porcelain -- \
            samples/minimal/client/src/_generated \
            samples/pricing-rules/client/src/_generated)"
          if [ -n "$changed" ]; then
            echo "::error::Committed _generated artifacts are stale. Rebuild the samples and commit the refreshed _generated/ output (see samples/*/regen.sh)."
            echo "$changed"
            git --no-pager diff -- \
              samples/minimal/client/src/_generated \
              samples/pricing-rules/client/src/_generated
            exit 1
          fi
          echo "Sample _generated artifacts are up to date."

      - name: Test
        run: dotnet test Mirrorgen.sln --no-build -c Release --verbosity normal

      - name: Pack (verify packaging)
        # `--no-build` was dropped because samples/minimal's ProjectReference
        # graph causes dotnet pack to re-invoke Build on the publishable
        # projects, which then collides with NoBuild=true (NETSDK1085). The
        # pack step does its own incremental build pass instead.
        #
        # This step IS the packaging smoke-test: if pack fails, the job fails.
        # The resulting .nupkg has no downstream consumer (release.yml packs
        # its own), so we intentionally do NOT upload it — uploading on every
        # push accumulated ~1GB of account-wide Actions storage in days,
        # exhausting the shared quota and blocking artifact uploads in sibling
        # repos. Real release packages come from release.yml on a tag.
        run: dotnet pack Mirrorgen.sln -c Release -o artifacts

  runtime-ts:
    name: runtime-ts build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime-ts
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: runtime-ts/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
